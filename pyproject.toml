[project]
name = "website-content-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GodswillSaviour", email = "godswillsaviour89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipython>=9.17.1",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
website-content-ai = "website_content_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
